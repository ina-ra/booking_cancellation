name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - frontend
      - production-no-manual-magic
      - "feature/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Run linter
        run: ruff check .

      - name: Run mypy
        run: mypy src

      - name: Run tests
        run: pytest

      - name: Verify Docker production build
        run: docker build -t booking-cancellation-app:test .

      - name: Prepare CI runtime env
        run: |
          cp .env.prod.example .env.ci
          python - <<'PY'
          from pathlib import Path
          path = Path(".env.ci")
          text = path.read_text()
          replacements = {
              "POSTGRES_PASSWORD=change-me": "POSTGRES_PASSWORD=ci-postgres-password",
              "S3_SECRET_KEY=change-me": "S3_SECRET_KEY=ci-minio-secret",
              "MINIO_ROOT_PASSWORD=change-me": "MINIO_ROOT_PASSWORD=ci-minio-secret",
              "AIRFLOW_ADMIN_PASSWORD=change-me": "AIRFLOW_ADMIN_PASSWORD=ci-airflow-password",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Container smoke test
        run: |
          export APP_ENV_FILE=.env.ci
          docker compose --env-file .env.ci -f docker-compose.prod.yml up --build -d postgres minio init-db seed-model app
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000/ready; then
              break
            fi
            sleep 5
          done
          curl --fail http://127.0.0.1:8000/ready
          curl --fail http://127.0.0.1:8000/frontend-api/health

      - name: Dump smoke stack logs on failure
        if: failure()
        run: |
          export APP_ENV_FILE=.env.ci
          docker compose --env-file .env.ci -f docker-compose.prod.yml ps
          docker compose --env-file .env.ci -f docker-compose.prod.yml logs --no-color

      - name: Tear down smoke stack
        if: always()
        run: |
          export APP_ENV_FILE=.env.ci
          docker compose --env-file .env.ci -f docker-compose.prod.yml down -v --remove-orphans
